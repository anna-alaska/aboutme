<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Микрооракул для HR</title>
  <style>html,body{overflow:hidden}
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#0b0b0b}
    button{font:inherit}
    #oracle-theme{--bg:#101010;--text:#f5f5f5;--muted:#929292;--line:#333;--dust:#ddd;--dustGlow:rgba(255,255,255,.65);--orb1:#fff;--orb2:#eee;--orb3:#aaa;--orb4:#5e5e5e;--orb5:#292929;--orb6:#aaa;min-height:100vh;position:relative;overflow:hidden;padding:24px 16px 32px;background:var(--bg);color:var(--text);text-align:center;transition:background .45s ease,color .45s ease;display:flex;flex-direction:column;justify-content:center;align-items:center}
    #oracle-theme.light-theme{--bg:#f7f5ef;--text:#111;--muted:#69645b;--line:#d7d0c1;--dust:#b38a35;--dustGlow:rgba(199,153,56,.55);--orb1:#fff7d6;--orb2:#f5d77d;--orb3:#c99b38;--orb4:#8c641d;--orb5:#5d3f0d;--orb6:#e4bc5d}
    .shell{width:min(100%,640px)}
    .top{display:flex;justify-content:flex-end}
    .theme-btn,.again{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer;transition:.25s}
    .theme-btn:hover,.again:hover{transform:translateY(-1px)}
    .lead{font-size:15px;color:var(--muted);margin:8px 0 0}
    .stage{position:relative;width:250px;height:250px;margin:6px auto 10px;display:grid;place-items:center}
    .orb{position:relative;z-index:3;width:164px;height:164px;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 30% 23%,var(--orb1) 0 5%,var(--orb2) 13%,var(--orb3) 34%,var(--orb4) 58%,var(--orb5) 73%,var(--orb6) 91%,var(--orb4) 100%);box-shadow:inset 15px 14px 25px rgba(255,255,255,.46),inset -18px -20px 30px rgba(0,0,0,.38),0 14px 28px rgba(0,0,0,.2);transition:background .45s ease,box-shadow .45s ease}
    .orb:before{content:"";position:absolute;left:18%;top:13%;width:42%;height:29%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.88),rgba(255,255,255,.14) 50%,transparent 73%);filter:blur(4px);transform:rotate(-22deg)}
    .orb:after{content:"";position:absolute;right:13%;bottom:15%;width:30%;height:20%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.24),transparent 72%);filter:blur(5px)}
    .halo{position:absolute;z-index:1;width:204px;height:204px;border-radius:50%;border:1px solid var(--line);opacity:.65;animation:halo 5s ease-in-out infinite}
    .dust{position:absolute;z-index:2;inset:0;pointer-events:none}
    .speck{position:absolute;border-radius:50%;background:var(--dust);box-shadow:0 0 8px var(--dustGlow);opacity:.5;animation:float var(--d) ease-in-out infinite alternate}
    .s1{width:3px;height:3px;left:17%;top:31%;--d:3.4s}.s2{width:2px;height:2px;left:25%;top:72%;--d:4.1s}.s3{width:4px;height:4px;left:75%;top:28%;--d:3.7s}.s4{width:2px;height:2px;left:82%;top:61%;--d:4.8s}.s5{width:3px;height:3px;left:9%;top:55%;--d:4.4s}.s6{width:2px;height:2px;left:67%;top:82%;--d:3.2s}.s7{width:2px;height:2px;left:51%;top:6%;--d:5s}.s8{width:3px;height:3px;left:91%;top:43%;--d:3.9s}.s9{width:2px;height:2px;left:37%;top:88%;--d:4.6s}.s10{width:2px;height:2px;left:13%;top:18%;--d:3.5s}.s11{width:4px;height:4px;left:77%;top:74%;--d:5.1s}.s12{width:2px;height:2px;left:60%;top:17%;--d:4.2s}
    .star{position:absolute;z-index:2;width:1px;height:15px;background:linear-gradient(transparent,var(--dust),transparent);opacity:.5;animation:twinkle 2.8s ease-in-out infinite}
    .star:after{content:"";position:absolute;width:15px;height:1px;left:-7px;top:7px;background:linear-gradient(90deg,transparent,var(--dust),transparent)}
    .st1{left:14%;top:41%}.st2{right:12%;top:34%;animation-delay:.8s}.st3{right:20%;bottom:17%;animation-delay:1.5s}
    .orb.spin{animation:spin 1.35s cubic-bezier(.4,.05,.18,1)}
    .stage.active .halo{animation:haloFast 1.35s linear infinite}
    .stage.active .speck{animation-duration:.75s}
    .hint{font-size:13px;color:var(--muted);margin-bottom:8px}
    .result{min-height:110px;display:flex;align-items:center;justify-content:center;padding:20px 22px;border-top:1px solid var(--line)}
    .prediction{font-size:20px;line-height:1.45;font-weight:600;letter-spacing:-.02em;white-space:pre-line;color:var(--text)}
    .thinking{font-size:14px;color:var(--muted);letter-spacing:.03em}
    .again{margin-top:12px}
    .hidden{display:none}
    .fade{animation:appear .45s ease both}
    @keyframes spin{0%{transform:rotate(0) scale(1)}35%{transform:rotate(130deg) scale(.96)}75%{transform:rotate(620deg) scale(1.035)}100%{transform:rotate(720deg) scale(1)}}
    @keyframes float{from{transform:translate(-4px,7px) scale(.7);opacity:.2}to{transform:translate(7px,-8px) scale(1.25);opacity:.85}}
    @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.15)}}
    @keyframes halo{0%,100%{transform:scale(.94);opacity:.25}50%{transform:scale(1.04);opacity:.65}}
    @keyframes haloFast{to{transform:rotate(360deg) scale(1.03)}}
    @keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
<style>html,body{overflow:hidden}
#oracle-theme{min-height:0;padding:20px 14px 24px}
.stage{width:min(250px,100%);height:auto;aspect-ratio:1}
.orb{width:66%;height:66%}.halo{width:82%;height:82%}
.result{padding:18px 0;min-height:110px}
.prediction{font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.lead{font-size:14px;line-height:1.4;margin-top:18px}
.theme-btn,.again{font-size:14px}
</style>
</head>
<body>
  <main id="oracle-theme" class="dark-theme">
    <div class="shell">
      
      <p class="lead">Есть сомнения? Спросите оракула.</p>
      <div class="stage">
        <div class="halo"></div>
        <div class="dust">
          <i class="speck s1"></i><i class="speck s2"></i><i class="speck s3"></i><i class="speck s4"></i><i class="speck s5"></i><i class="speck s6"></i><i class="speck s7"></i><i class="speck s8"></i><i class="speck s9"></i><i class="speck s10"></i><i class="speck s11"></i><i class="speck s12"></i>
          <i class="star st1"></i><i class="star st2"></i><i class="star st3"></i>
        </div>
        <button type="button" class="orb" aria-label="Спросить микрооракула"></button>
      </div>
      <div class="hint">Тапните на шар</div>
      <div class="result" aria-live="polite"><div class="prediction">Он знает, стоит ли звать Анну на собеседование.</div></div>
      <button type="button" class="again hidden">Спросить ещё раз</button>
    </div>
  </main>
  <script>
    (()=>{const root=document.querySelector('#oracle-theme');const orb=root.querySelector('.orb'),stage=root.querySelector('.stage'),out=root.querySelector('.prediction'),hint=root.querySelector('.hint'),again=root.querySelector('.again');
    const p=['Звёзды говорят: стоит поговорить.\nВ худшем случае у вас будет хороший созвон.','Карты показывают редкое сочетание:\nдизайн + продукт + AI + понимание разработки.','Вижу человека, который может не только нарисовать AI-фичу,\nно и объяснить разработчику, как она должна работать.','Знак благоприятный.\nКандидат умеет разговаривать и с пользователями, и с разработчиками, и с бизнесом.','Оракул сообщает:\n«Сделаем AI» — это ещё не продукт. Кажется, кандидат это понимает.','Карты показывают опыт от discovery\nдо момента «оно реально работает».','Вижу системные промпты. RAG. Интерфейсы.\nИ человека, которому зачем-то всё это нравится.','Есть вероятность, что фраза «а давайте быстро запрототипируем»\nздесь действительно означает «быстро».','Карты говорят: можно долго обсуждать гипотезу.\nА можно собрать прототип и проверить.','Предсказание туманно.\nПопробуйте посмотреть ещё один кейс.','Где-то в будущем этого кандидата\nуже добавляют в рабочий чат.','Совпадение навыков обнаружено.\nОракул выглядит подозрительно довольным.'];
    let busy=false,count=0,last=-1;

    function ask(){if(busy)return;busy=true;count++;orb.classList.remove('spin');void orb.offsetWidth;orb.classList.add('spin');stage.classList.add('active');hint.style.opacity='.25';again.classList.add('hidden');out.className='thinking';out.textContent=count%3===1?'анализирую знаки...':count%3===2?'изучаю кейсы...':'сверяюсь со звёздами...';
      setTimeout(()=>{const cycleStep=(count-1)%4;let msg;if(cycleStep===3)msg='Оракул устал.\nПросто позовите Анну на собеседование.';else if(Math.random()<.12)msg='Вы можете закрыть эту вкладку.\nНо мысль «а может, всё-таки позвать?» останется.';else{let i;do{i=Math.floor(Math.random()*p.length)}while(i===last&&p.length>1);last=i;msg=p[i]}out.className='prediction fade';out.textContent=msg;orb.classList.remove('spin');stage.classList.remove('active');busy=false;again.classList.remove('hidden')},1350)}
    orb.addEventListener('click',ask);again.addEventListener('click',ask);
    })();
  </script>
</body>
</html>
